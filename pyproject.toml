[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "study-radar"
version = "1.0.0"
description = "StudyRadar — локальный ИИ-агент: сортирует учебные сообщения из Telegram-чатов и ведёт доску дедлайнов"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Команда SuperPuper, МГТУ им. Н. Э. Баумана, ИУ5-31Б" }]
dependencies = [
    "langgraph==1.2.18",
    "langchain-core==1.7.3",
    "langchain-mcp-adapters==0.3.2",
    "mcp==1.30.0",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "ollama==0.6.3",
    "aiogram==3.31.0",
    "pydantic==2.13.5",
    "dateparser==1.4.3",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "rich==15.0.0",
    "streamlit==1.66.1",
    "pandas==3.1.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]
slides = ["python-pptx==1.0.2", "playwright==1.64.1"]

[project.scripts]
study-radar = "study_radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
study_radar = ["storage/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
